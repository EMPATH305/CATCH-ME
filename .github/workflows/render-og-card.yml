name: Render OG card PNG

on:
  push:
    branches: [main]
    paths:
      - 'og-card.svg'
      - '.github/workflows/render-og-card.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Render PNG
        run: rsvg-convert -w 1200 -h 630 og-card.svg -o og-card.png
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add og-card.png
          if git diff --cached --quiet; then
            echo "No PNG changes"
          else
            git commit -m "chore: render OG social preview PNG"
            git push
          fi
