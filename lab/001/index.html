const scenarios=[{id:'u1',factor:'U',en:['them','i like spending time with you.','but i don’t really know what this is to me yet.','can we keep seeing each other?'],zh:['對方','我真的喜歡跟你相處。','但我還不太清楚這段關係對我是什麼。','我們可以繼續見面嗎？']},{id:'c1',factor:'C',en:['them','i like you. i mean that.','but i’m leaving soon, and we probably won’t stay in touch.','would you still want this?'],zh:['對方','我喜歡你。是真的。','但我很快就要離開，之後可能不會再聯絡。','你還會想繼續嗎？']},{id:'r1',factor:'R',en:['them','you matter to me. i want to keep you in my life.','but i don’t see us becoming romantic partners.','would you still want to be close?'],zh:['對方','你對我很重要，我也想繼續有你在生活裡。','但我不覺得我們會成為戀人。','你還想和我親近嗎？']},{id:'u2',factor:'U',en:['them','i’ll keep showing up. you don’t have to worry about me disappearing.','but i can’t tell you what this means to me yet.','do you keep opening up?'],zh:['對方','我會一直在，不用擔心我突然消失。','但我現在還說不清這段關係的意義。','你還願意繼續敞開心嗎？']},{id:'c2',factor:'C',en:['them','i’m certain about how i feel.','we only have a little time together, though.','do you let yourself get closer?'],zh:['對方','我很確定自己對你的感覺。','但我們能相處的時間真的不多。','你會讓自己再靠近一些嗎？']},{id:'r2',factor:'R',en:['them','i’ll be around, and i care about you.','i’m not looking for a romantic relationship with you.','do you stay emotionally close?'],zh:['對方','我會繼續在，也很在乎你。','但我不想和你發展戀愛關係。','你還會維持這份情感親近嗎？']},{id:'testU',factor:'U',en:['them','i know exactly what i want: to keep seeing you.','i’m just not very good at responding when conversations get emotional.','do you keep getting closer?'],zh:['對方','我很清楚我想繼續見你。','只是碰到情緒比較重的話題，我常不知道怎麼回應。','你還會繼續靠近嗎？']},{id:'testC',factor:'C',en:['them','i’m not promising romance.','but i do want us to remain in each other’s lives.','would you keep exploring this?'],zh:['對方','我沒辦法承諾戀愛。','但我希望我們可以一直留在彼此生活裡。','你還會繼續探索這段關係嗎？']},{id:'testR',factor:'R',en:['them','i’d like to see if we could become something romantic.','i’m still figuring out my feelings, though.','would you keep exploring?'],zh:['對方','我想看看我們有沒有可能發展成戀人。','但我還在釐清自己的感覺。','你還願意繼續嗎？' let history=[];let state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};const app=document.getElementById('app'),lang=document.getElementById('lang');let L=()=>lang.value,t=()=>T[L()];function el(s){app.innerHTML=s}function btn(label,fn,cls='primary'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function addActions(...buttons){const d=document.createElement('div');d.className='actions';buttons.forEach(b=>d.appendChild(b));app.appendChild(d)}function title(k,body){el(`<div class="eyebrow">${k}</div>${body}`)}function record(){return {version:'game-lab-001-v0.2',language:L(),self:state.self,answers:state.answers,feedback:state.feedback,disclaimer:'Hypothetical scenario choices; exploratory only'}}function download(){let blob=new Blob([JSON.stringify(record(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catch-me-lab-001-test.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function count(){let a=state.answers;return {caught:a.filter(x=>x.hit===true).length,missed:a.filter(x=>x.hit===false).length}}function navigate(phase,mutate){history.push(structuredClone(state));if(mutate)mutate();state.phase=phase;render()}function goBack(){if(!history.length)return;state=history.pop();render()}function intro(){title('CATCH ME / EXPERIMENT 001',`<h1>${t().intro}</h1><p>${t().introSub}</p><p class="muted tiny">${t().note}</p>`);addActions(btn(t().start,()=>{navigate('self')}))}function self(){title('BEFORE WE BEGIN',`<h2>${t().self}</h2>`);t().selfOpts.forEach((x,i)=>addActions(btn(x,()=>{navigate('bet',()=>{state.self=i})},'choice')))}function current(){return scenarios[Math.min(state.round,scenarios.length-1)]}function factorHistory(f){return state.answers.filter(a=>a.factor===f&&a.choice!==null)}function predict(s){let hist=factorHistory(s.factor);if(hist.length){let yes=hist.filter(a=>a.choice===1).length;let no=hist.length-yes;return yes>no?1:no>yes?0:(state.self===['U','C','R'].indexOf(s.factor)?0:1)}return state.self===['U','C','R'].indexOf(s.factor)?0:1}function bet(){let s=current();state.prediction=predict(s);let n=count();title(`ROUND ${String(state.round+1).padStart(2,'0')} / ${n.caught} CAUGHT · ${n.missed} MISSED`,`<h1>${t().bet}</h1><div class="panel"><h2>${state.prediction?t().predYes:t().predNo}</h2><p>${t().explain}</p></div>`);addActions(btn(t().lock,()=>{navigate('scene')}))}function scene(){let s=current(),a=s[L()];title(`ROUND ${String(state.round+1).padStart(2,'0')} — ${t().scene}`,`<div class="chat">${a.slice(1).map(x=>`<div class="bubble"><div class="from">${a[0]}</div>${x}</div>`).join('')}</div>`);addActions(btn(t().yes,()=>choose(1)),btn(t().no,()=>choose(0),'secondary'),btn(t().neither,()=>choose(null),'secondary'))}function choose(choice){let s=current();let hit=choice===null?null:choice===state.prediction;navigate('reveal',()=>{state.answers.push({id:s.id,factor:s.factor,choice,prediction:state.prediction,hit})})}function reveal(){let a=state.answers.at(-1),isSkip=a.choice===null;title(`ROUND ${String(state.round+1).padStart(2,'0')}`,`<h1 class="${a.hit===false?'miss':'result'}">${isSkip?'—':a.hit?t().caught:t().missed}</h1><p>${isSkip?t().skip:a.hit?t().hit:t().nohit}</p><div class="stats"><span>${count().caught} CAUGHT</span><span>${count().missed} MISSED</span></div>`);let next=()=>{navigate(state.round+1>=7?'finish':'bet',()=>{state.round++})};addActions(btn(state.round>=6?t().finish:t().next,next),...(state.round>=2&&state.round<6?[btn(t().challenge,()=>{navigate('bet',()=>{state.challenged=true;state.round=6})},'secondary')]:[]))}function finish(){let a=state.answers.filter(x=>x.choice!==null),by={};for(let f of ['U','C','R']){let h=a.filter(x=>x.factor===f);by[f]={n:h.length,hold:h.filter(x=>x.choice===0).length}}let labels=L()==='en'?{U:'When intentions are unclear',C:'When contact may end',R:'When romance is off the table'}:{U:'當對方意圖不明',C:'當未來可能失去聯絡',R:'當沒有戀愛發展可能'};let entries=Object.entries(by).filter(([f,v])=>v.n>0).sort((a,b)=>(b[1].hold/b[1].n)-(a[1].hold/a[1].n));let best=entries[0],insight=best&&best[1].hold>0?(L()==='en'?`You held back in ${best[1].hold} of ${best[1].n} situations involving: ${labels[best[0]]}. That's an observation, not a conclusion about why.`:`在「${labels[best[0]]}」的 ${best[1].n} 個情境中，你有 ${best[1].hold} 次選擇退一步。這是觀察，不是原因的定論。`):t().notyet;title('THE LIVING MAP',`<h1>${t().finish}</h1><div class="panel"><p>${insight}</p><p class="muted tiny">${t().end}</p></div><h2>${t().map}</h2><div class="map">${Object.entries(by).map(([f,v])=>`<div><b>${labels[f]}</b>${v.n?`${v.hold} / ${v.n} ${L()==='en'?'held back':'次退一步'}`:'NOT ENOUGH DATA'}</div>`).join('')}</div><div class="line"></div><h2>${t().feedback}</h2>`);addActions(...[t().agree,t().almost,t().reject,t().unknown].map((x,i)=>btn(x,()=>{history.push(structuredClone(state));state.feedback=i;renderFeedback()},i===0?'primary':'secondary')))}function renderFeedback(){finish();const d=document.createElement('p');d.className='muted';d.textContent=L()==='en'?'Feedback saved locally for export. Thank you for challenging me.':'回饋已記錄於本機，匯出時會一起保存。謝謝你挑戰我的推測。';app.appendChild(d);addActions(btn(t().export,download),btn(t().restart,()=>{history=[];state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};render()},'secondary'))}function render(){({intro,self,bet,scene,reveal,finish})[state.phase]();if(history.length){const back=btn(L()==='en'?'← BACK':'← 返回上一頁',goBack,'secondary back-nav');app.prepend(back)}if(state.phase==='finish'&&state.feedback!==null){let d=document.createElement('div');d.className='actions';d.append(btn(t().export,download),btn(t().restart,()=>{state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};render()},'secondary'));app.append(d)}}lang.onchange=render;render();
