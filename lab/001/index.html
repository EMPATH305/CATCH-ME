<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CATCH ME — THE GAME LAB</title><style>
:root{color-scheme:dark;--bg:#080a10;--panel:#111522;--ink:#f4f1ef;--dim:#a7a8b8;--hot:#d5ff57;--pink:#ff70b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#292044 0%,transparent 45%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif;min-height:100vh}button{font:inherit;cursor:pointer}header{max-width:900px;margin:auto;padding:24px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:950;letter-spacing:.16em}.tag{color:var(--dim);font-size:12px;letter-spacing:.13em}main{max-width:760px;margin:4vh auto;padding:20px 22px 90px}.eyebrow{color:var(--hot);font-size:12px;letter-spacing:.2em;font-weight:800}h1{font-size:clamp(42px,9vw,88px);line-height:.97;letter-spacing:-.065em;margin:20px 0}h2{font-size:clamp(29px,6vw,48px);line-height:1.1;letter-spacing:-.045em}p{color:#d6d4dd}.muted{color:var(--dim)}.panel{border:1px solid #333448;background:#111521d9;border-radius:22px;padding:24px;margin:25px 0}.primary,.choice,.secondary{border:1px solid #575766;padding:16px 22px;border-radius:13px;color:var(--ink);background:#1b1e2d;font-weight:800}.primary{background:var(--hot);border-color:var(--hot);color:#11140b}.secondary{background:transparent}.choice{width:100%;text-align:left;transition:.2s}.choice:hover,.secondary:hover{border-color:var(--hot)}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.chat{display:flex;flex-direction:column;gap:14px;margin:25px 0}.bubble{max-width:88%;padding:15px 18px;border-radius:17px;background:#27283a;align-self:flex-start;white-space:pre-line}.bubble:nth-child(even){background:#322337}.from{font-size:11px;color:var(--pink);font-weight:800;letter-spacing:.12em;margin-bottom:5px}.stats{display:flex;gap:20px;color:var(--dim);font-size:12px;letter-spacing:.12em}.result{color:var(--hot)}.miss{color:var(--pink)}.tiny{font-size:13px}.map{display:grid;gap:10px}.map>div{border:1px solid #343749;padding:15px;border-radius:12px}.map b{display:block;color:var(--hot);font-size:11px;letter-spacing:.1em}.line{height:1px;background:#343749;margin:22px 0}select{background:#202438;color:white;border:1px solid #575766;padding:8px;border-radius:8px}button:focus-visible{outline:3px solid #fff;outline-offset:3px}@media(max-width:520px){header{padding:17px}main{margin:1vh auto}.panel{padding:18px}.actions button{width:100%}}</style></head><body><header><div><div class="brand">CATCH ME<span style="color:var(--pink)">.</span></div><div class="tag">DON'T LABEL ME. LEARN ME.</div></div><select id="lang" aria-label="Language"><option value="en">EN</option><option value="zh">繁中</option></select></header><main id="app"></main><script>
const T={en:{intro:'YOU THINK YOU KNOW YOURSELF?',introSub:'Good. I think I can predict you. One of us is going to be wrong.',start:'MAKE YOUR FIRST MOVE',self:'What usually makes you hesitate when someone gets close?',selfOpts:['Not knowing how they feel','Not knowing if they will stay','Not knowing if this could become romantic','None of those / it depends'],bet:'MY BET',lock:'LOCK YOUR PREDICTION',scene:'THE MOMENT',yes:'GET CLOSER',no:'HOLD BACK',neither:'NEITHER FITS / SKIP',caught:'CAUGHT.',missed:'MISSED.',next:'GIVE ME ANOTHER SHOT',challenge:'PROVE ME WRONG',finish:'WHAT I THINK I LEARNED',export:'EXPORT TEST RECORD',restart:'PLAY AGAIN',feedback:'DID I GET THAT RIGHT?',agree:'THAT’S ME',almost:'NOT QUITE',reject:'NOPE',unknown:'I DON’T KNOW',note:'This is an exploratory game about hypothetical choices, not a psychological assessment.',map:'THE LIVING MAP',notyet:'NOT CAUGHT. NOT YET.',skip:'Skipped: no inference made.',predYes:'You’ll get closer.',predNo:'You’ll hold back.',explain:'I can predict a choice without knowing why you made it. This is only a hunch.',why:'What changed your answer?',whyOpts:['Clarity','Whether they stay','Romantic possibility','Something else','Not sure'],end:'I made predictions, missed some, and learned where my assumptions break. Your choices here are hypothetical—not a diagnosis.',revision:'I was looking at the wrong thing. Updating my theory.',hit:'I called this choice. That doesn’t mean I know your reasons.',nohit:'You surprised me. One miss is evidence to reconsider—not proof of a new theory.'},zh:{intro:'你以為你很了解自己？',introSub:'很好。我覺得我能猜中你的選擇。我們之中，總有一個會猜錯。',start:'來，第一回合',self:'當你和某個人逐漸靠近，什麼最容易讓你猶豫？',selfOpts:['不知道對方怎麼想','不知道對方會不會留下','不知道有沒有發展成戀愛的可能','都不是／看情況'],bet:'我的賭注',lock:'鎖定預測',scene:'現在，換你選',yes:'繼續靠近',no:'先退一步',neither:'都不符合／跳過',caught:'CAUGHT. 猜中了。',missed:'MISSED. 猜錯了。',next:'再給我一次機會',challenge:'來推翻我',finish:'我目前學到的事',export:'匯出測試紀錄',restart:'再玩一次',feedback:'這個推測像你嗎？',agree:'就是我',almost:'有一點',reject:'不是',unknown:'我也不知道',note:'這是一場探索假設情境選擇的遊戲，不是心理測驗或診斷。',map:'持續更新的地圖',notyet:'還沒抓到你。至少現在沒有。',skip:'已跳過；不做推論。',predYes:'我猜你會靠近。',predNo:'我猜你會退一步。',explain:'我可以猜對選擇，卻不一定知道原因。這只是暫時的猜想。',why:'這次讓你改變想法的是？',whyOpts:['能否讀懂對方','對方會不會留下','戀愛發展的可能','其他原因','不確定'],end:'我做了預測，也有猜錯的時候；現在比較清楚哪些假設站不住腳。這些只是情境中的選擇，不代表真實生活中的你。',revision:'我剛剛看錯重點了。修正假設。',hit:'這次猜中了，但不代表我知道你的理由。',nohit:'你讓我意外了。猜錯一次，代表該重新思考，而不是急著貼新標籤。'}};
const scenarios=[{id:'u1',factor:'U',en:['them','i like spending time with you.','but i don’t really know what this is to me yet.','can we keep seeing each other?'],zh:['對方','我真的喜歡跟你相處。','但我還不太清楚這段關係對我是什麼。','我們可以繼續見面嗎？']},{id:'c1',factor:'C',en:['them','i like you. i mean that.','but i’m leaving soon, and we probably won’t stay in touch.','would you still want this?'],zh:['對方','我喜歡你。是真的。','但我很快就要離開，之後可能不會再聯絡。','你還會想繼續嗎？']},{id:'r1',factor:'R',en:['them','you matter to me. i want to keep you in my life.','but i don’t see us becoming romantic partners.','would you still want to be close?'],zh:['對方','你對我很重要，我也想繼續有你在生活裡。','但我不覺得我們會成為戀人。','你還想和我親近嗎？']},{id:'u2',factor:'U',en:['them','i’ll keep showing up. you don’t have to worry about me disappearing.','but i can’t tell you what this means to me yet.','do you keep opening up?'],zh:['對方','我會一直在，不用擔心我突然消失。','但我現在還說不清這段關係的意義。','你還願意繼續敞開心嗎？']},{id:'c2',factor:'C',en:['them','i’m certain about how i feel.','we only have a little time together, though.','do you let yourself get closer?'],zh:['對方','我很確定自己對你的感覺。','但我們能相處的時間真的不多。','你會讓自己再靠近一些嗎？']},{id:'r2',factor:'R',en:['them','i’ll be around, and i care about you.','i’m not looking for a romantic relationship with you.','do you stay emotionally close?'],zh:['對方','我會繼續在，也很在乎你。','但我不想和你發展戀愛關係。','你還會維持這份情感親近嗎？']},{id:'testU',factor:'U',en:['them','i know exactly what i want: to keep seeing you.','i’m just not very good at responding when conversations get emotional.','do you keep getting closer?'],zh:['對方','我很清楚我想繼續見你。','只是碰到情緒比較重的話題，我常不知道怎麼回應。','你還會繼續靠近嗎？']},{id:'testC',factor:'C',en:['them','i’m not promising romance.','but i do want us to remain in each other’s lives.','would you keep exploring this?'],zh:['對方','我沒辦法承諾戀愛。','但我希望我們可以一直留在彼此生活裡。','你還會繼續探索這段關係嗎？']},{id:'testR',factor:'R',en:['them','i’d like to see if we could become something romantic.','i’m still figuring out my feelings, though.','would you keep exploring?'],zh:['對方','我想看看我們有沒有可能發展成戀人。','但我還在釐清自己的感覺。','你還願意繼續嗎？']}];
let state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};const app=document.getElementById('app'),lang=document.getElementById('lang');let L=()=>lang.value,t=()=>T[L()];function el(s){app.innerHTML=s}function btn(label,fn,cls='primary'){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function addActions(...buttons){const d=document.createElement('div');d.className='actions';buttons.forEach(b=>d.appendChild(b));app.appendChild(d)}function title(k,body){el(`<div class="eyebrow">${k}</div>${body}`)}function record(){return {version:'game-lab-001-v0.2',language:L(),self:state.self,answers:state.answers,feedback:state.feedback,disclaimer:'Hypothetical scenario choices; exploratory only'}}function download(){let blob=new Blob([JSON.stringify(record(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='catch-me-lab-001-test.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function count(){let a=state.answers;return {caught:a.filter(x=>x.hit===true).length,missed:a.filter(x=>x.hit===false).length}}function intro(){title('CATCH ME / EXPERIMENT 001',`<h1>${t().intro}</h1><p>${t().introSub}</p><p class="muted tiny">${t().note}</p>`);addActions(btn(t().start,()=>{state.phase='self';render()}))}function self(){title('BEFORE WE BEGIN',`<h2>${t().self}</h2>`);t().selfOpts.forEach((x,i)=>addActions(btn(x,()=>{state.self=i;state.phase='bet';render()},'choice')))}function current(){return scenarios[Math.min(state.round,scenarios.length-1)]}function factorHistory(f){return state.answers.filter(a=>a.factor===f&&a.choice!==null)}function predict(s){let hist=factorHistory(s.factor);if(hist.length){let yes=hist.filter(a=>a.choice===1).length;let no=hist.length-yes;return yes>no?1:no>yes?0:(state.self===['U','C','R'].indexOf(s.factor)?0:1)}return state.self===['U','C','R'].indexOf(s.factor)?0:1}function bet(){let s=current();state.prediction=predict(s);let n=count();title(`ROUND ${String(state.round+1).padStart(2,'0')} / ${n.caught} CAUGHT · ${n.missed} MISSED`,`<h1>${t().bet}</h1><div class="panel"><h2>${state.prediction?t().predYes:t().predNo}</h2><p>${t().explain}</p></div>`);addActions(btn(t().lock,()=>{state.phase='scene';render()}))}function scene(){let s=current(),a=s[L()];title(`ROUND ${String(state.round+1).padStart(2,'0')} — ${t().scene}`,`<div class="chat">${a.slice(1).map(x=>`<div class="bubble"><div class="from">${a[0]}</div>${x}</div>`).join('')}</div>`);addActions(btn(t().yes,()=>choose(1)),btn(t().no,()=>choose(0),'secondary'),btn(t().neither,()=>choose(null),'secondary'))}function choose(choice){let s=current();let hit=choice===null?null:choice===state.prediction;state.answers.push({id:s.id,factor:s.factor,choice,prediction:state.prediction,hit});state.phase='reveal';render()}function reveal(){let a=state.answers.at(-1),isSkip=a.choice===null;title(`ROUND ${String(state.round+1).padStart(2,'0')}`,`<h1 class="${a.hit===false?'miss':'result'}">${isSkip?'—':a.hit?t().caught:t().missed}</h1><p>${isSkip?t().skip:a.hit?t().hit:t().nohit}</p><div class="stats"><span>${count().caught} CAUGHT</span><span>${count().missed} MISSED</span></div>`);let next=()=>{state.round++;state.phase=state.round>=7?'finish':'bet';render()};addActions(btn(state.round>=6?t().finish:t().next,next),...(state.round>=2&&state.round<6?[btn(t().challenge,()=>{state.challenged=true;state.round=6;state.phase='bet';render()},'secondary')]:[]))}function finish(){let a=state.answers.filter(x=>x.choice!==null),by={};for(let f of ['U','C','R']){let h=a.filter(x=>x.factor===f);by[f]={n:h.length,hold:h.filter(x=>x.choice===0).length}}let labels=L()==='en'?{U:'When intentions are unclear',C:'When contact may end',R:'When romance is off the table'}:{U:'當對方意圖不明',C:'當未來可能失去聯絡',R:'當沒有戀愛發展可能'};let entries=Object.entries(by).filter(([f,v])=>v.n>0).sort((a,b)=>(b[1].hold/b[1].n)-(a[1].hold/a[1].n));let best=entries[0],insight=best&&best[1].hold>0?(L()==='en'?`You held back in ${best[1].hold} of ${best[1].n} situations involving: ${labels[best[0]]}. That's an observation, not a conclusion about why.`:`在「${labels[best[0]]}」的 ${best[1].n} 個情境中，你有 ${best[1].hold} 次選擇退一步。這是觀察，不是原因的定論。`):t().notyet;title('THE LIVING MAP',`<h1>${t().finish}</h1><div class="panel"><p>${insight}</p><p class="muted tiny">${t().end}</p></div><h2>${t().map}</h2><div class="map">${Object.entries(by).map(([f,v])=>`<div><b>${labels[f]}</b>${v.n?`${v.hold} / ${v.n} ${L()==='en'?'held back':'次退一步'}`:'NOT ENOUGH DATA'}</div>`).join('')}</div><div class="line"></div><h2>${t().feedback}</h2>`);addActions(...[t().agree,t().almost,t().reject,t().unknown].map((x,i)=>btn(x,()=>{state.feedback=i;renderFeedback()},i===0?'primary':'secondary')))}function renderFeedback(){finish();const d=document.createElement('p');d.className='muted';d.textContent=L()==='en'?'Feedback saved locally for export. Thank you for challenging me.':'回饋已記錄於本機，匯出時會一起保存。謝謝你挑戰我的推測。';app.appendChild(d);addActions(btn(t().export,download),btn(t().restart,()=>{state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};render()},'secondary'))}function render(){({intro,self,bet,scene,reveal,finish})[state.phase]();if(state.phase==='finish'&&state.feedback!==null){let d=document.createElement('div');d.className='actions';d.append(btn(t().export,download),btn(t().restart,()=>{state={phase:'intro',round:0,self:null,answers:[],feedback:null,prediction:null,challenged:false,why:null};render()},'secondary'));app.append(d)}}lang.onchange=render;render();
</script></body></html>
